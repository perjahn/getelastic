name: Build

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Get containers
      run: ./build.sh
    - name: Update release
      run: ./update_release.sh "${{ secrets.GITHUB_TOKEN }}"
